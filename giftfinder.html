<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Finder | iVerxa Finds</title>

<link rel="stylesheet" href="css/style.css">

<style>
.finder-box{
    max-width:700px;
    margin:60px auto;
    background:#1E293B;
    padding:40px;
    border-radius:20px;
}

.finder-box h1{
    text-align:center;
    margin-bottom:30px;
}

.finder-box label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

.finder-box select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0F172A;
    color:white;
    font-size:16px;
}

.find-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#4F7CFF;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.find-btn:hover{
    background:#3567ff;
}
</style>

</head>

<body>

<nav>
<div class="logo">
    <img src="images/logo.jpeg" alt="iVerxa Logo">
</div>

<ul class="menu">
<li><a href="index.html">Home</a></li>
<li><a href="giftcards.html">Gift Cards</a></li>
<li><a href="giftfinder.html">Gift Finder</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<div class="finder-box">

<h1>🎁 Gift Finder</h1>

<label>Gift For</label>
<select id="relation">
<option value="ALL">Select Relation</option>
<option value="Brother">Brother</option>
<option value="Sister">Sister</option>
<option value="Mother">Mother</option>
<option value="Father">Father</option>
<option value="Friend">Friend</option>
<option value="Girlfriend">Girlfriend</option>
<option value="Boyfriend">Boyfriend</option>
</select>

<label>Age Group</label>
<select id="age">
<option value="ALL">Select Age</option>
<option value="KIDS">0 - 12 Years</option>
<option value="TEEN">13 - 17 Years</option>
<option value="YOUNG">18 - 25 Years</option>
<option value="ADULT">26 - 40 Years</option>
<option value="SENIOR">40+ Years</option>
</select>

<label>Budget</label>
<select id="budget">
<option value="ALL">Select Budget</option>
<option value="U500">Under ₹500</option>
<option value="500-1000">₹500 - ₹1000</option>
<option value="1000-2500">₹1000 - ₹2500</option>
<option value="ABOVE2500">Above ₹2500</option>
</select>

<label>Occasion</label>
<select id="occasion">
<option value="ALL">Select Occasion</option>
<option>Birthday</option>
<option>Anniversary</option>
<option>Friendship Day</option>
<option>Raksha Bandhan</option>
<option>Valentine's Day</option>
<option>Festival</option>
</select>

<button class="find-btn">
Find Gifts
</button>

<p style="text-align:center; margin-top:15px; color:#cbd5e1;">
Select filters above and click <b>Find Gifts</b>.
</p>

<div id="results" style="margin-top:40px;"></div>

</div>

<footer class="footer">
    Crafted with ❤️ in Maharashtra, India 🇮🇳
    <br><br>
    © 2026 iVerxa Finds. All Rights Reserved.
</footer>

<script>
const productsList = [
    // --- UNDER ₹500 ---
    { title: "Astronaut Keychain", desc: "Cute Space Metallic Keychain", budget: "U500", ageGroup: ["TEEN", "YOUNG"], target: ["Sister", "Girlfriend", "Friend"], img: "images/products/astronaut-keychain.jpg", link: "https://fktr.in/GTf82Im" },
    { title: "Tanjiro Anime Keychain", desc: "Demon Slayer Collectible Keychain", budget: "U500", ageGroup: ["TEEN", "YOUNG"], target: ["Brother", "Friend", "Sister"], img: "images/products/tanjiro-keychain.jpg", link: "https://fktr.in/wRjcwlF" },
    { title: "Spider-Man Keychain", desc: "Marvel Official Collectible Keychain", budget: "U500", ageGroup: ["TEEN", "YOUNG"], target: ["Brother", "Friend"], img: "images/products/spiderman-keychain.jpg", link: "https://fktr.in/T932Nk6" },
    { title: "Raw Eau De Parfum (20ml)", desc: "Pocket Fragrance for Daily Wear", budget: "U500", ageGroup: ["YOUNG", "ADULT"], target: ["Brother", "Boyfriend", "Friend"], img: "images/products/raw-perfume.jpg", link: "https://fktr.in/YJeHEwk" },
    { title: "White Oud Unisex Perfume", desc: "Woody & Premium Long-Lasting Fragrance", budget: "U500", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Brother", "Boyfriend", "Sister", "Girlfriend", "Friend", "Father", "Mother"], img: "images/products/white-oud.jpg", link: "https://fktr.in/fY2f6cm" },

    // --- ₹500 - ₹1000 ---
    { title: "Dancing Cactus Toy", desc: "Singing & Talking Interactive Toy", budget: "500-1000", ageGroup: ["KIDS"], target: ["Brother", "Sister", "Friend"], img: "images/products/cactus.jpg", link: "https://fktr.in/Wg2rHER" },
    { title: "Rabbit USB Night Light", desc: "Cute Silicone Night Lamp", budget: "500-1000", ageGroup: ["KIDS", "TEEN"], target: ["Sister", "Girlfriend", "Friend"], img: "images/products/rabbit.jpg", link: "https://fktr.in/tosKE5q" },
    { title: "Pharaoh K12 Speaker", desc: "Wireless Bluetooth Karaoke Speaker", budget: "500-1000", ageGroup: ["TEEN", "YOUNG"], target: ["Brother", "Sister", "Friend"], img: "images/products/speaker.jpg", link: "https://fktr.in/lU3c4AF" },
    { title: "CEO MAN & White Oud Combo", desc: "Luxury Fragrance Gift Set (40ml)", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Brother", "Boyfriend", "Father", "Friend"], img: "images/products/ceo-whiteoud.jpg", link: "https://fktr.in/EpZzsXs" },
    { title: "Hydra Luxury Men Perfume", desc: "Fresh Aqua EDP Spray (100ml)", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Brother", "Boyfriend", "Father", "Friend"], img: "images/products/hydra-perfume.jpg", link: "https://fktr.in/RYUzCy4" },
    { title: "Blue Dial Analog Watch", desc: "Classic Stainless Steel Wrist Watch", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Brother", "Boyfriend", "Father", "Friend"], img: "images/products/blue-watch.jpg", link: "https://fktr.in/hw4EuTu" },
    { title: "Peter England Everyday Watch", desc: "Elegant Formal Men's Watch", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Brother", "Boyfriend", "Father"], img: "images/products/watch1.jpg", link: "https://fktr.in/2PCt7Rv" },
    { title: "Women Green & White Bag", desc: "Stylish Shoulder Handbag", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Sister", "Girlfriend", "Mother"], img: "images/products/women-green-bag.jpg", link: "https://fktr.in/7B905x9" },
    { title: "Pink & Ivory Cotton Tote Bag", desc: "Handcrafted Woven Shoulder Bag", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Sister", "Girlfriend", "Mother"], img: "images/products/tote-bag.jpg", link: "https://fktr.in/11c1iDx" },
    { title: "Women Blue Cosmetic Bag", desc: "Travel Toiletries & Makeup Pouch", budget: "500-1000", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Sister", "Girlfriend", "Mother"], img: "images/products/cosmetic-bag.jpg", link: "https://fktr.in/FfT4LwA" },

    // --- ₹1000 - ₹2500 ---
    { title: "Kids Digital Action Camera", desc: "2.0\" Display & Video Recording", budget: "1000-2500", ageGroup: ["KIDS"], target: ["Brother", "Sister"], img: "images/products/kids-camera.jpg", link: "https://fktr.in/99BrGav" },
    { title: "Astronaut Star Projector", desc: "3D Galaxy Ambient Night Lamp", budget: "1000-2500", ageGroup: ["TEEN", "YOUNG"], target: ["Brother", "Sister", "Friend", "Girlfriend", "Boyfriend"], img: "images/products/projector.jpg", link: "https://fktr.in/Tb8mY5R" },
    { title: "Peter England Premium Watch", desc: "Luxury Analog Dress Watch", budget: "1000-2500", ageGroup: ["ADULT", "SENIOR"], target: ["Brother", "Boyfriend", "Father"], img: "images/products/watch2.jpg", link: "https://fktr.in/4mE66ek" },
    { title: "Saturn Crystal Ball Decor", desc: "3D Glowing Crystal Desk Decor", budget: "1000-2500", ageGroup: ["YOUNG", "ADULT", "SENIOR"], target: ["Brother", "Sister", "Friend", "Father", "Mother"], img: "images/products/saturn.jpg", link: "https://fktr.in/87EgaG7" }
];

document.querySelector(".find-btn").addEventListener("click", function(){

    let selectedRelation = document.getElementById("relation").value;
    let selectedAge = document.getElementById("age").value;
    let selectedBudget = document.getElementById("budget").value;
    let result = document.getElementById("results");

    let filteredProducts = productsList.filter(item => {
        let budgetMatch = (selectedBudget === "ALL" || item.budget === selectedBudget);
        let ageMatch = (selectedAge === "ALL" || item.ageGroup.includes(selectedAge));
        let relationMatch = (selectedRelation === "ALL" || item.target.includes(selectedRelation));

        return budgetMatch && ageMatch && relationMatch;
    });

    if (filteredProducts.length > 0) {
        let cardsHTML = '<div class="gift-grid">';
        filteredProducts.forEach(prod => {
            cardsHTML += `
            <div class="gift-card">
                <img src="${prod.img}">
                <h3>${prod.title}</h3>
                <p>${prod.desc}</p>
                <a href="${prod.link}" target="_blank">View Deal</a>
            </div>`;
        });
        cardsHTML += '</div>';
        result.innerHTML = cardsHTML;
    } else {
        result.innerHTML = `
        <div class="product-card">
            <h3>😔 No Exact Gift Match Found</h3>
            <p>Try selecting 'Select Budget' or 'Select Age' to view all recommended gifts for this relation.</p>
            <a href="giftcards.html">Browse Gift Cards</a>
        </div>`;
    }

});
</script>

</body>
</html>
